# Démarrage local : cp .env.example .env (puis remplir), puis
#   docker compose up -d postgres          # base seule, l'API tourne depuis l'IDE ou ./mvnw spring-boot:run
#   docker compose --profile app up -d     # base + API
#   docker compose --profile app --profile spark-cluster up -d   # + cluster Spark (SPARK_MASTER=spark://spark-master:7077)
#   docker compose --profile app --profile monitoring up -d      # + Prometheus (localhost:9090) et Grafana (localhost:3000)
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoopmind
      POSTGRES_USER: ${DB_USERNAME:-hoopmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hoopmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: [app]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hoopmind
      SPARK_DRIVER_HOST: backend
      NBA_DATABASE_PATH: /app/data/nba.sqlite
      ML_MODEL_DIR: /app/models
    volumes:
      # Base NBA (téléchargée depuis la page « Données » ou par scripts/download-nba-database.sh) et modèle entraîné
      - ./data:/app/data
      - spark_models:/app/models
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  spark-master:
    profiles: [spark-cluster]
    image: apache/spark:4.2.0-java21
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    profiles: [spark-cluster]
    image: apache/spark:4.2.0-java21
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    depends_on:
      - spark-master

  # Monitoring : Prometheus lit /actuator/prometheus avec METRICS_PASSWORD, Grafana affiche le tableau de bord
  # « HoopMind » (monitoring/grafana/dashboards/hoopmind.json). Ports ouverts sur la machine locale seulement.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_password
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hoopmind.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

secrets:
  metrics_password:
    environment: METRICS_PASSWORD

volumes:
  postgres_data:
  spark_models:
  prometheus_data:
  grafana_data:
