databaseChangeLog:
  - changeSet:
      id: 008-refresh-token-family
      author: hoopmind
      comment: Rotation des jetons de rafraîchissement avec détection de réutilisation (famille de jetons)
      changes:
        - delete:
            tableName: refresh_tokens
        - addColumn:
            tableName: refresh_tokens
            columns:
              - column:
                  name: family_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_token_family
            columns:
              - column:
                  name: family_id

  - changeSet:
      id: 008-remove-unused-roles
      author: hoopmind
      comment: Seuls ROLE_USER et ROLE_ADMIN sont utilisés par l'application
      changes:
        - sql:
            sql: >
              DELETE FROM user_roles WHERE role_id IN
              (SELECT id FROM roles WHERE name IN ('ROLE_ANALYST', 'ROLE_MODERATOR'));
              DELETE FROM roles WHERE name IN ('ROLE_ANALYST', 'ROLE_MODERATOR');
