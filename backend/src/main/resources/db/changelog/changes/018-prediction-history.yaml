databaseChangeLog:
  - changeSet:
      id: 018-prediction-history
      author: hoopmind
      comment: Prédictions demandées par chaque utilisateur ; une ligne par match prédit, mise à jour s'il le redemande.
      changes:
        - createTable:
            tableName: prediction_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prediction_history_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: season_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prediction_history_season
                    references: seasons(id)
                    deleteCascade: true
              - column:
                  name: home_team_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prediction_history_home_team
                    references: teams(id)
                    deleteCascade: true
              - column:
                  name: away_team_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prediction_history_away_team
                    references: teams(id)
                    deleteCascade: true
              - column:
                  name: game_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: playoff
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: home_win_probability
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: predicted_home_points
                  type: INTEGER
              - column:
                  name: predicted_away_points
                  type: INTEGER
              - column:
                  name: model
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: predicted_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: prediction_history
            columnNames: user_id, season_id, home_team_id, away_team_id, game_date, playoff
            constraintName: uk_prediction_history_match
        - createIndex:
            tableName: prediction_history
            indexName: idx_prediction_history_user_date
            columns:
              - column:
                  name: user_id
              - column:
                  name: predicted_at
                  descending: true
