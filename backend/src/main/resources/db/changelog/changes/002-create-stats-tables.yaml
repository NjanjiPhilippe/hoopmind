databaseChangeLog:
  - changeSet:
      id: 002-create-player-stats-table
      author: nba-prediction
      changes:
        - createTable:
            tableName: player_stats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: player_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_player_stats_player
                    references: players(id)
              - column:
                  name: season_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_player_stats_season
                    references: seasons(id)
              - column:
                  name: games_played
                  type: INT
              - column:
                  name: games_started
                  type: INT
              - column:
                  name: minutes_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: points_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: field_goals_made
                  type: DECIMAL(5,2)
              - column:
                  name: field_goals_attempted
                  type: DECIMAL(5,2)
              - column:
                  name: field_goal_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: three_points_made
                  type: DECIMAL(5,2)
              - column:
                  name: three_points_attempted
                  type: DECIMAL(5,2)
              - column:
                  name: three_point_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: free_throws_made
                  type: DECIMAL(5,2)
              - column:
                  name: free_throws_attempted
                  type: DECIMAL(5,2)
              - column:
                  name: free_throw_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: offensive_rebounds
                  type: DECIMAL(5,2)
              - column:
                  name: defensive_rebounds
                  type: DECIMAL(5,2)
              - column:
                  name: total_rebounds_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: assists_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: steals_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: blocks_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: turnovers_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: fouls_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: player_efficiency_rating
                  type: DECIMAL(5,2)
              - column:
                  name: true_shooting_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: effective_field_goal_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: plus_minus
                  type: DECIMAL(6,2)
              - column:
                  name: offensive_rating
                  type: DECIMAL(6,2)
              - column:
                  name: defensive_rating
                  type: DECIMAL(6,2)
              - column:
                  name: usage_rate
                  type: DECIMAL(5,3)
              - column:
                  name: last_updated
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: player_stats
            columnNames: player_id, season_id
            constraintName: uk_player_season
        - createIndex:
            tableName: player_stats
            indexName: idx_player_stats_player
            columns:
              - column:
                  name: player_id
        - createIndex:
            tableName: player_stats
            indexName: idx_player_stats_season
            columns:
              - column:
                  name: season_id

  - changeSet:
      id: 002-create-team-stats-table
      author: nba-prediction
      changes:
        - createTable:
            tableName: team_stats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: team_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_team_stats_team
                    references: teams(id)
              - column:
                  name: season_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_team_stats_season
                    references: seasons(id)
              - column:
                  name: wins
                  type: INT
              - column:
                  name: losses
                  type: INT
              - column:
                  name: win_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: conference_rank
                  type: INT
              - column:
                  name: division_rank
                  type: INT
              - column:
                  name: home_wins
                  type: INT
              - column:
                  name: home_losses
                  type: INT
              - column:
                  name: away_wins
                  type: INT
              - column:
                  name: away_losses
                  type: INT
              - column:
                  name: points_per_game
                  type: DECIMAL(6,2)
              - column:
                  name: points_allowed_per_game
                  type: DECIMAL(6,2)
              - column:
                  name: points_differential
                  type: DECIMAL(6,2)
              - column:
                  name: field_goal_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: three_point_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: free_throw_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: rebounds_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: assists_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: steals_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: blocks_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: turnovers_per_game
                  type: DECIMAL(5,2)
              - column:
                  name: offensive_rating
                  type: DECIMAL(6,2)
              - column:
                  name: defensive_rating
                  type: DECIMAL(6,2)
              - column:
                  name: net_rating
                  type: DECIMAL(6,2)
              - column:
                  name: pace
                  type: DECIMAL(5,2)
              - column:
                  name: effective_field_goal_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: true_shooting_percentage
                  type: DECIMAL(5,3)
              - column:
                  name: current_streak
                  type: INT
              - column:
                  name: longest_win_streak
                  type: INT
              - column:
                  name: longest_lose_streak
                  type: INT
              - column:
                  name: last_10_games_json
                  type: TEXT
              - column:
                  name: last_updated
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: team_stats
            columnNames: team_id, season_id
            constraintName: uk_team_season
        - createIndex:
            tableName: team_stats
            indexName: idx_team_stats_team
            columns:
              - column:
                  name: team_id
        - createIndex:
            tableName: team_stats
            indexName: idx_team_stats_season
            columns:
              - column:
                  name: season_id