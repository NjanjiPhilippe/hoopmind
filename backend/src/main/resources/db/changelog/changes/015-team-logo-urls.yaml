databaseChangeLog:
    # Lien du logo de chaque franchise, sur le site de la NBA (l'image n'est pas copiée : seule l'adresse est en base).
    # L'équipe est retrouvée par son abréviation, car les équipes de départ n'ont pas encore d'identifiant NBA.
    # Un logo déjà renseigné est gardé. Les équipes créées plus tard par l'import reçoivent le leur à ce moment-là.
    - changeSet:
          id: 015-team-logo-urls
          author: hoopmind
          changes:
              - sql:
                    sql: >
                        UPDATE teams t
                        SET logo_url = 'https://cdn.nba.com/logos/nba/' || f.nba_id || '/global/L/logo.svg'
                        FROM (VALUES
                          ('ATL', 1610612737),
                          ('BOS', 1610612738),
                          ('CLE', 1610612739),
                          ('NOP', 1610612740),
                          ('CHI', 1610612741),
                          ('DAL', 1610612742),
                          ('DEN', 1610612743),
                          ('GSW', 1610612744),
                          ('HOU', 1610612745),
                          ('LAC', 1610612746),
                          ('LAL', 1610612747),
                          ('MIA', 1610612748),
                          ('MIL', 1610612749),
                          ('MIN', 1610612750),
                          ('BKN', 1610612751),
                          ('NYK', 1610612752),
                          ('ORL', 1610612753),
                          ('IND', 1610612754),
                          ('PHI', 1610612755),
                          ('PHX', 1610612756),
                          ('POR', 1610612757),
                          ('SAC', 1610612758),
                          ('SAS', 1610612759),
                          ('OKC', 1610612760),
                          ('TOR', 1610612761),
                          ('UTA', 1610612762),
                          ('MEM', 1610612763),
                          ('WAS', 1610612764),
                          ('DET', 1610612765),
                          ('CHA', 1610612766)
                        ) AS f(abbreviation, nba_id)
                        WHERE t.abbreviation = f.abbreviation
                          AND (t.logo_url IS NULL OR t.logo_url = '')
