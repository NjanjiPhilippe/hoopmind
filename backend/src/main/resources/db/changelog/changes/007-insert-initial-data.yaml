databaseChangeLog:
    # Insérer les rôles par défaut
    - changeSet:
          id: 007-insert-roles
          author: nba-prediction
          changes:
              - insert:
                    tableName: roles
                    columns:
                        - column:
                              name: name
                              value: ROLE_USER
                        - column:
                              name: description
                              value: Utilisateur standard
              - insert:
                    tableName: roles
                    columns:
                        - column:
                              name: name
                              value: ROLE_ADMIN
                        - column:
                              name: description
                              value: Administrateur du système
              - insert:
                    tableName: roles
                    columns:
                        - column:
                              name: name
                              value: ROLE_ANALYST
                        - column:
                              name: description
                              value: Analyste de données
              - insert:
                    tableName: roles
                    columns:
                        - column:
                              name: name
                              value: ROLE_MODERATOR
                        - column:
                              name: description
                              value: Modérateur

    # Insérer la saison actuelle
    - changeSet:
          id: 007-insert-current-season
          author: nba-prediction
          changes:
              - insert:
                    tableName: seasons
                    columns:
                        - column:
                              name: year
                              valueNumeric: 2024
                        - column:
                              name: name
                              value: "2024-2025"
                        - column:
                              name: start_date
                              value: "2024-10-22"
                        - column:
                              name: end_date
                              value: "2025-04-13"
                        - column:
                              name: playoffs_start_date
                              value: "2025-04-19"
                        - column:
                              name: finals_start_date
                              value: "2025-06-05"
                        - column:
                              name: status
                              value: IN_PROGRESS

