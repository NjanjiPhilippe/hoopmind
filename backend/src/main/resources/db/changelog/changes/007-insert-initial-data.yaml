    # Les comptes ne sont plus créés par migration : l'administrateur initial vient des variables
    # d'environnement HOOPMIND_ADMIN_* (voir AdminBootstrap).

    # Insérer quelques joueurs exemple (via SQL pour plus de flexibilité)
    - changeSet:
          id: 007-insert-sample-players
          author: nba-prediction
          changes:
              - sql:
                    sql: |
                        INSERT INTO players (first_name, last_name, position, jersey_number, team_id, birth_date, height, weight, nationality, status)
                        SELECT 'LeBron', 'James', 'SMALL_FORWARD', 23, t.id, '1984-12-30', 206, 113, 'USA', 'ACTIVE'
                        FROM teams t WHERE t.abbreviation = 'LAL';
                        
                        INSERT INTO players (first_name, last_name, position, jersey_number, team_id, birth_date, height, weight, nationality, status)
                        SELECT 'Stephen', 'Curry', 'POINT_GUARD', 30, t.id, '1988-03-14', 191, 84, 'USA', 'ACTIVE'
                        FROM teams t WHERE t.abbreviation = 'GSW';
                        
                        INSERT INTO players (first_name, last_name, position, jersey_number, team_id, birth_date, height, weight, nationality, status)
                        SELECT 'Jayson', 'Tatum', 'SMALL_FORWARD', 0, t.id, '1998-03-03', 203, 95, 'USA', 'ACTIVE'
                        FROM teams t WHERE t.abbreviation = 'BOS';