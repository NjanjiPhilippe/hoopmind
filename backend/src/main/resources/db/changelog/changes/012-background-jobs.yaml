databaseChangeLog:
  - changeSet:
      id: 012-create-background-jobs
      author: hoopmind
      comment: Jobs en arrière-plan (import NBA, entraînement du modèle) ; leur état survit aux redémarrages.
      changes:
        - createTable:
            tableName: background_jobs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: step
                  type: VARCHAR(40)
              - column:
                  name: requested_by_id
                  type: BIGINT
              - column:
                  name: requested_by_login
                  type: VARCHAR(100)
              - column:
                  name: parameters
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: finished_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: result
                  type: JSONB
              - column:
                  name: error
                  type: VARCHAR(500)
        - createIndex:
            tableName: background_jobs
            indexName: idx_background_jobs_type_created
            columns:
              - column:
                  name: type
              - column:
                  name: created_at
                  descending: true
