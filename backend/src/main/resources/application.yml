# Configuration HoopMind. Aucun secret ici : tout ce qui est sensible vient de variables d'environnement
# (voir .env.example). Le profil « prod » durcit les réglages.
spring:
  application:
    name: hoopmind
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: hoopmind-task-
      # À l'arrêt, on laisse aux tâches en cours (jobs d'import, d'entraînement) le temps de finir ;
      # celles qui dépassent seront marquées « interrompues » au prochain démarrage.
      shutdown:
        await-termination: true
        await-termination-period: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hoopmind}
    username: ${DB_USERNAME:hoopmind}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        # Le pilote réécrit chaque lot d'INSERT en un seul INSERT multi-lignes : bien moins d'allers-retours
        # pendant l'import des données NBA.
        reWriteBatchedInserts: true

  jpa:
    # Le schéma appartient à Liquibase ; Hibernate se contente de le vérifier.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    default-property-inclusion: non_null

  # Listes paginées : 100 éléments au plus par page, quel que soit le paramètre size envoyé.
  data:
    web:
      pageable:
        max-page-size: 100

  mvc:
    problemdetails:
      enabled: true

  # Dépôt des CSV de l'archive NBA Stats depuis l'interface (le zip complet fait environ 10 Mo, 32 Mo décompressé)
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

hoopmind:
  version: '@project.version@'
  # Monitoring (voir backend/docs/adr/0019-monitoring.md) : /actuator/prometheus n'est lisible qu'avec ces
  # identifiants HTTP Basic. Sans mot de passe, l'endpoint reste fermé.
  monitoring:
    scrape:
      username: ${METRICS_USERNAME:prometheus}
      password: ${METRICS_PASSWORD:}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      refresh-cookie:
        secure: ${REFRESH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Premier administrateur, créé au démarrage s'il n'en existe aucun (laisser vide pour ne rien créer).
  bootstrap-admin:
    username: ${HOOPMIND_ADMIN_USERNAME:admin}
    email: ${HOOPMIND_ADMIN_EMAIL:admin@hoopmind.local}
    password: ${HOOPMIND_ADMIN_PASSWORD:}
  # Import de la base NBA de Wyatt Walsh (Kaggle wyattowalsh/basketball), voir scripts/download-nba-database.sh
  import:
    nba-database:
      path: ${NBA_DATABASE_PATH:data/nba.sqlite}
      seasons: ${NBA_IMPORT_SEASONS:10}
      on-startup: ${NBA_IMPORT_ON_STARTUP:false}
    # Téléchargement de cette base par le serveur, depuis la page « Données » (clé : https://www.kaggle.com/settings)
    kaggle:
      username: ${KAGGLE_USERNAME:}
      key: ${KAGGLE_KEY:}
    # Saisons récentes lues sur stats.nba.com (public, sans clé), depuis la page « Données »
    stats-nba:
      delay-ms: ${STATS_NBA_DELAY_MS:3000}
    # Saisons récentes (après 2022-23) : Games.csv et TeamStatistics.csv du jeu Kaggle
    # eoinamoore/historical-nba-data-and-player-box-scores, déposés dans ce dossier
    eoin-moore:
      directory: ${EOINMOORE_DATA_DIR:data/eoinamoore}
  ml:
    spark:
      enabled: ${SPARK_ENABLED:true}
    # Nombre de saisons (les plus récentes) utilisées pour entraîner le modèle de prédiction des matchs
    training-seasons: ${ML_TRAINING_SEASONS:5}
    # Dossier où le modèle entraîné est enregistré (rechargé au redémarrage)
    model-dir: ${ML_MODEL_DIR:spark-models}
    # Explication des prédictions en français par un LLM (voir backend/docs/adr/0015-explication-par-llm.md).
    # « none » : explication rédigée sans LLM. « openai-compatible » : Gemini, Groq, Ollama, OpenAI…
    # « anthropic » : Claude. La clé vient uniquement de l'environnement.
    explanation:
      provider: ${LLM_PROVIDER:none}
      base-url: ${LLM_BASE_URL:}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:}
      timeout: ${LLM_TIMEOUT:20s}
  # Journal d'audit : durée de conservation (purge chaque nuit).
  audit:
    retention: ${AUDIT_RETENTION:365d}

# Apache Spark (module ml)
spark:
  master: ${SPARK_MASTER:local[*]}
  app-name: hoopmind-analytics
  executor:
    memory: ${SPARK_EXECUTOR_MEMORY:1g}
  driver:
    memory: ${SPARK_DRIVER_MEMORY:1g}
    host: ${SPARK_DRIVER_HOST:localhost}
  sql:
    shuffle:
      partitions: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8083}
  # Derrière nginx, l'adresse du client arrive dans X-Forwarded-For. Tomcat ne la lit que si la requête vient
  # d'une adresse privée (le conteneur nginx) : un client ne peut pas choisir son adresse en envoyant l'en-tête
  # lui-même. Sans ce réglage, tous les clients auraient l'adresse de nginx (voir ADR 0007).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ROLE_ADMIN
  metrics:
    tags:
      application: hoopmind
    distribution:
      # Histogrammes des temps de réponse HTTP : percentiles calculables dans Prometheus et Grafana
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.np3tech.hoopmind: DEBUG
    org.apache.spark: WARN
    org.sparkproject: WARN
