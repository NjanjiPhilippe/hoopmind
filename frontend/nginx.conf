events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Pas de version de nginx dans les en-têtes ni les pages d'erreur.
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Derrière un proxy qui termine le HTTPS (Cloudflare, répartiteur de charge), $remote_addr est l'adresse du
        # proxy : la limite des connexions deviendrait commune à tous les visiteurs. Déclarer alors ses plages
        # d'adresses pour retrouver celle du visiteur (pour Cloudflare : https://www.cloudflare.com/ips/).
        # set_real_ip_from 173.245.48.0/20;
        # real_ip_header CF-Connecting-IP;

        # En-têtes de sécurité. nginx n'hérite pas des add_header d'un niveau supérieur dans un bloc location qui en
        # définit lui-même : ils sont donc répétés dans le bloc des fichiers statiques.
        # CSP : le hash autorise le seul script en ligne d'Angular (chargement différé de la feuille de style).
        # Images : logos de la NBA et photos chargées par lien (voir le README du frontend).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.nba.com https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org https://www.michaeljordansworld.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Cache pour les assets statiques
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.nba.com https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org https://www.michaeljordansworld.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Angular routing - toutes les routes vers index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy vers le backend : le frontend et l'API partagent la même origine
        # (pas de CORS, et le cookie de rafraîchissement reste SameSite=Strict).
        location /api/ {
            proxy_pass http://backend:8083;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # nginx est le point d'entrée : il remplace l'en-tête au lieu de compléter celui du client, qui pourrait
            # sinon y glisser une fausse adresse. Le backend s'en sert pour limiter les tentatives de connexion.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Même limite que le backend (spring.servlet.multipart.max-request-size) : sans elle, nginx refuse tout
            # envoi de plus de 1 Mo, dont l'archive CSV de la page Données.
            client_max_body_size 200m;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # L'import des CSV est traité pendant la requête : une archive complète peut dépasser une minute.
        location = /api/v1/admin/imports/csv {
            proxy_pass http://backend:8083;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 200m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
