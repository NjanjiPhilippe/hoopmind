<app-auth-layout heading="Connexion" subheading="Accédez à vos prédictions NBA">
  @if (error(); as message) {
    <div class="mb-4 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-600" role="alert">{{ message }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
    <div>
      <label for="login" class="mb-2 block text-sm font-medium text-gray-700">Nom d'utilisateur ou e-mail</label>
      <input id="login" type="text" formControlName="login" class="input-field" autocomplete="username" />
      @if (form.controls.login.invalid && form.controls.login.touched) {
        <p class="mt-1 text-sm text-red-600">Champ requis</p>
      }
    </div>

    <div>
      <label for="password" class="mb-2 block text-sm font-medium text-gray-700">Mot de passe</label>
      <input id="password" type="password" formControlName="password" class="input-field" autocomplete="current-password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <p class="mt-1 text-sm text-red-600">Champ requis</p>
      }
    </div>

    <button type="submit" [disabled]="submitting()" class="btn-primary w-full py-3 text-lg">
      @if (submitting()) {
        <span class="spinner h-5 w-5 border-2"></span>
      } @else {
        Se connecter
      }
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-600">
    Pas encore de compte ?
    <a routerLink="/auth/register" class="font-medium text-primary-600 hover:text-primary-700">S'inscrire</a>
  </p>
</app-auth-layout>
