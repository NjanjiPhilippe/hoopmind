<div class="card hover:scale-105 transition-transform cursor-pointer" 
         [routerLink]="['/teams', team.id]">
      <div class="flex items-center space-x-4">
        <img [src]="teamLogo" [alt]="team.name" 
             class="w-16 h-16 object-contain"
             (error)="onImageError($event)">
        <div class="flex-1">
          <h3 class="font-bold text-lg text-gray-900">{{ team.name }}</h3>
          <p class="text-sm text-gray-600">{{ team.city }}</p>
          <div class="flex items-center space-x-2 mt-2">
            <span class="badge badge-info text-xs">{{ team.conference }}</span>
            <span class="badge text-xs bg-gray-100 text-gray-800">{{ team.abbreviation }}</span>
          </div>
        </div>
      </div>
    </div>
